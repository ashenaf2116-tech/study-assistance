name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Compile all Java files
      - name: Compile Java files
        run: javac *.java

      # Step 4: Check all required OOP files exist
      - name: Check project structure
        run: |
          echo "Checking required files..."
          test -f Task.java && echo "✅ Task.java found" || (echo "❌ Task.java missing" && exit 1)
          test -f StudyTask.java && echo "✅ StudyTask.java found" || (echo "❌ StudyTask.java missing" && exit 1)
          test -f AssigmentTask.java && echo "✅ AssigmentTask.java found" || (echo "❌ AssigmentTask.java missing" && exit 1)
          test -f Assistant.java && echo "✅ Assistant.java found" || (echo "❌ Assistant.java missing" && exit 1)
          test -f Main.java && echo "✅ Main.java found" || (echo "❌ Main.java missing" && exit 1)
          test -f README.md && echo "✅ README.md found" || (echo "❌ README.md missing" && exit 1)

      # Step 5: Check OOP concepts are in the code
      - name: Check OOP concepts
        run: |
          echo "Checking OOP concepts..."

          # Check Encapsulation - private fields exist
          grep -q "private" Task.java && echo "✅ Encapsulation: private fields found in Task.java" || (echo "❌ No private fields found" && exit 1)

          # Check Inheritance - extends keyword exists
          grep -q "extends Task" StudyTask.java && echo "✅ Inheritance: StudyTask extends Task" || (echo "❌ Inheritance missing in StudyTask" && exit 1)
          grep -q "extends Task" AssigmentTask.java && echo "✅ Inheritance: AssigmentTask extends Task" || (echo "❌ Inheritance missing in AssigmentTask" && exit 1)

          # Check Polymorphism - @Override exists
          grep -q "@Override" StudyTask.java && echo "✅ Polymorphism: @Override found in StudyTask" || (echo "❌ @Override missing in StudyTask" && exit 1)
          grep -q "@Override" AssigmentTask.java && echo "✅ Polymorphism: @Override found in AssigmentTask" || (echo "❌ @Override missing in AssigmentTask" && exit 1)

          # Check Method Overloading - two addTask methods
          count=$(grep -c "addTask" Assistant.java) && echo "✅ Method Overloading: addTask appears $count times" || echo "⚠️ Check addTask overloading"

          # Check super() is used
          grep -q "super(" StudyTask.java && echo "✅ super() found in StudyTask" || (echo "❌ super() missing" && exit 1)

          echo ""
          echo "================================"
          echo "✅ ALL OOP CHECKS PASSED!"
          echo "================================"

      # Step 6: Check code quality - no empty files
      - name: Check code quality
        run: |
          echo "Checking code quality..."
          for file in *.java; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt 5 ]; then
              echo "❌ $file seems too short ($lines lines)"
              exit 1
            else
              echo "✅ $file looks good ($lines lines)"
            fi
          done

      # Step 7: Success message
      - name: Pipeline passed
        run: |
          echo ""
          echo "🎉 ================================"
          echo "🎉  PIPELINE PASSED SUCCESSFULLY!"
          echo "🎉  All OOP concepts verified."
          echo "🎉  Code compiles without errors."
          echo "🎉 ================================"
